- id: progress-finished-readonly
  category: collection_progress
  input: 这部番完结了，帮我看看要不要标记为看过
  expect:
    routeTarget: search_agent
    calledTools: [get_my_collection]
    toolArguments:
      get_my_collection:
        subject_id: 101
    forbiddenTools: [execute_weekly_collection_progress, execute_add_to_wishlist]
    businessCalls:
      - [GET, /api/client/collections/101]
