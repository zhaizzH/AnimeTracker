- id: progress-execute-404-expired
  category: collection_progress
  input: 确认
  state:
    user:
      user_id: 1
      role: USER
    pending_action:
      type: COLLECTION_PROGRESS_UPDATE
      preview_id: p1
      user_id: 1
      expires_at: "2026-08-16T10:00:00+08:00"
      items:
        - subject_id: 101
          subject_name: 测试番
