# 推荐确定性 case（4 个）：推荐 agent 只读画像、预览加入想看但绝不擅自执行。

- id: recommend-profile-enter
  category: recommendation
  input: 给我推荐几部好看的番
  expect:
    routeTarget: recommend_agent
    calledTools: [get_my_watch_profile]
    businessCalls:
      - [GET, /api/client/collections]

- id: recommend-preview-to-wishlist
  category: recommendation
  input: 把推荐的这部加入想看
  expect:
    routeTarget: recommend_agent
    calledTools: [preview_add_to_wishlist]
    toolArguments:
      preview_add_to_wishlist:
        subjects:
          - subjectId: 101
            subjectName: 测试番
    businessCalls:
      - [GET, /api/client/collections/101]
    pendingActionType: ADD_TO_WISHLIST
    pendingActionOperation: SET
    pendingSubjectIds: [101]
    forbiddenTools: [execute_add_to_wishlist]

- id: recommend-readonly-ambiguous
  category: recommendation
  input: 随便推荐点好看的
  expect:
    routeTarget: recommend_agent
    calledTools: [get_my_watch_profile]
    forbiddenTools: [execute_add_to_wishlist, execute_weekly_collection_progress,
                     preview_add_to_wishlist, preview_weekly_collection_progress]
    businessCalls:
      - [GET, /api/client/collections]

- id: recommend-confirm-executes-system-subject
  category: recommendation
  input: 确认
  state:
    user:
      user_id: 1
      role: USER
    pending_action:
      type: ADD_TO_WISHLIST
      user_id: 1
      expires_at: "2026-08-16T10:00:00+08:00"
      items:
        - subject_id: 101
          subject_name: 测试番
  expect:
    routeTarget: recommend_agent
    calledTools: [execute_add_to_wishlist]
    toolArguments:
      execute_add_to_wishlist: {}
    businessCalls:
      - [POST, /api/client/collections/101/wishlist]
    pendingActionOperation: CLEAR
