# 加入想看确定性 case（8 个）：预览、跳过已收藏、确认执行、拒绝写入、部分失败。

- id: wishlist-preview-after-recommend
  category: wishlist
  input: 把推荐的这部加入想看
  expect:
    routeTarget: recommend_agent
    calledTools: [preview_add_to_wishlist]
    toolArguments:
      preview_add_to_wishlist:
        subjects:
          - subjectId: 101
            subjectName: 测试番
    businessCalls:
      - [GET, /api/client/collections/101]
    pendingActionType: ADD_TO_WISHLIST
    pendingActionOperation: SET
    pendingSubjectIds: [101]
    forbiddenTools: [execute_add_to_wishlist]

