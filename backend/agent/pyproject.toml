[project]
name = "anime-tracker-agent"
version = "3.0.0"
description = "AnimeTracker Agent (FastAPI + LangGraph)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "dashscope>=1.20.0",
    "langchain>=1.3.0",
    "langchain-community==0.4.2",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "redis>=5.0",
    "fakeredis>=2.0",
    "pyjwt>=2.0",
    "PyYAML>=6.0",
    # ---- importer（Bangumi 数据导入）----
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "minio>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
