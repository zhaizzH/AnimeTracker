# ===================================================================
# AnimeTracker API — 生产环境配置
# 所有连接信息与密钥均来自宿主机 .env（由 Docker Compose 注入）。
# 必填项缺失时 Spring 占位符解析失败，应用启动即失败。
# 由 Compose 设置 SPRING_PROFILES_ACTIVE=prod 激活本文件。
# ===================================================================
spring:
  datasource:
    driver-class-name: ${MYSQL_DRIVER}
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

at:
  agent:
    host: ${AGENT_HOST}
    port: ${AGENT_PORT}

  admin:
    superadmin-id: ${AT_ADMIN_SUPERADMIN_ID}

  cors:
    allowed-origins: ${AT_CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  max-login-fails: ${JWT_MAX_LOGIN_FAILS}
  login-fail-window-minutes: ${JWT_LOGIN_FAIL_WINDOW_MINUTES}

minio:
  host: ${MINIO_HOST}
  port: ${MINIO_PORT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

resend:
  api-key: ${RESEND_API_KEY}
  send-email: ${RESEND_SEND_EMAIL}
