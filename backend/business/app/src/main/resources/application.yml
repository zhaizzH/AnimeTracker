# ===================================================================
# AnimeTracker API — 公共配置
# 默认面向本地开发（带可启动的默认值），不再默认激活 local profile。
# 生产环境通过 Docker Compose 设置 SPRING_PROFILES_ACTIVE=prod，密钥由 application-prod.yml 从环境变量读取。
# ===================================================================
server:
  port: 8080

spring:
  application:
    name: animetracker-business # 应用名称

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    driver-class-name: ${at.datasource.driver-class-name:com.mysql.cj.jdbc.Driver} # 数据库驱动类名
    url: jdbc:mysql://${at.datasource.host:localhost}:${at.datasource.port:3306}/${at.datasource.database:anime_tracker}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${at.datasource.username:root}
    password: ${at.datasource.password:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 5000

  sql:
    init:
      # 不使用 Flyway，数据库结构由 docs/database/db-schema.sql 手动维护
      mode: never

  data:
    redis:  # redis 配置
      host: ${at.data.redis.host:localhost}
      port: ${at.data.redis.port:6379}
      password: ${at.data.redis.password:}
      database: ${at.data.redis.database:1}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: ${at.jackson.default-property-inclusion:non_null}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: top.zhaizz.pojo.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# AI Agent 服务
at:
  auth:
    refresh-cookie:
      name: at_refresh
      path: /api/client/auth
      secure: ${AT_AUTH_COOKIE_SECURE:false}
      same-site: Lax
  agent:
    base-url: http://${at.agent.host:localhost}:${at.agent.port:8090}
    connect-timeout: 10000
    read-timeout: 30000

  # 管理端
  admin:
    superadmin-id: 1  # 管理员用户 ID

  # CORS 跨域白名单（逗号分隔）
  cors:
    allowed-origins: ${at.cors.origins}

# JWT 配置
jwt:
  secret: ${at.jwt.secret:dev-secret-key-not-for-production-use-change-it}
  expiration: ${at.jwt.expiration:1800000}    # 30 分钟
  refresh-expiration: ${at.jwt.refresh-expiration:604800000}  # 7 天
  max-login-fails: ${at.jwt.max-login-fails:5}  # 登录失败次数限制
  login-fail-window-minutes: ${at.jwt.login-fail-window-minutes:300}
  max-session-expiration: ${at.jwt.max-session-expiration:2592000000}  # 30 天绝对上限


# MinIO 对象存储
minio:
  endpoint: http://${minio.host:localhost}:${minio.port:9000}
  access-key: ${at.minio.access-key:minioadmin}
  secret-key: ${at.minio.secret-key:minioadmin}
  bucket: ${at.minio.bucket:anime-tracker}

# Resend 邮件服务
resend:
  api-key: ${at.resend.api-key:}
  send-email: ${at.resend.send-email:admin@localhost}  # 发件人邮箱

# Actuator 健康检查
# Liveness: 进程响应即可，不依赖外部组件；Readiness: 仅要求 MySQL 与 Redis。
# Agent/MinIO 不作为 readiness 强制条件，避免单点能力故障拖垮整体就绪状态。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# 日志（格式由 logback-spring.xml 输出单行结构化 JSON）
logging:
  level:
    top.zhaizz: warn
    com.baomidou.mybatisplus: warn
