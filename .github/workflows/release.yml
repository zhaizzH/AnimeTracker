# =====================================================================
# 版本发布: 仅在版本标签(v*)触发
# 使用 GITHUB_TOKEN 认证,构建并推送 GHCR 镜像(标签 + commit SHA),
# 记录镜像摘要。不向任何主机 SSH。
# =====================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

# 构建阶段用占位必需变量(镜像构建不需要真实密钥)
env:
  MYSQL_PASSWORD: ci-dummy-mysql-password
  MYSQL_ROOT_PASSWORD: ci-dummy-mysql-root-password
  REDIS_PASSWORD: ci-dummy-redis-password
  JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
  AT_ADMIN_SUPERADMIN_ID: "1"
  MINIO_ACCESS_KEY: ci-dummy-minio-access
  MINIO_SECRET_KEY: ci-dummy-minio-secret
  DOMAIN: ci.example.com
  CERT_EMAIL: ci@example.com
  DEMO_USER_PASSWORD: ci-dummy-demo-password

jobs:
  publish:
    name: Publish ${{ matrix.service }} to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: business
            context: ./backend/business
          - service: agent
            context: ./backend/agent
          - service: demo-seeder
            context: ./deploy/demo-seeder
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build-push
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/animetracker/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/animetracker/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Record image digest
        run: |
          echo "animetracker/${{ matrix.service }} -> ghcr.io/${{ github.repository_owner }}/animetracker/${{ matrix.service }}:${{ github.ref_name }} (${{ steps.build-push.outputs.digest }})"
          echo "animetracker/${{ matrix.service }} digest: ${{ steps.build-push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
