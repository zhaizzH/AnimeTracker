name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test
        working-directory: backend/business

  backend-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
        working-directory: backend/agent
      - name: lint (ruff, pyflakes rules only)
        run: uv run ruff check .
        working-directory: backend/agent
      # 契约漂移单独成步：失败时日志标题即指明「agent ↔ business 契约漂移」，
      # 而不是混在全量用例里的一条匿名 FAILED。全量 pytest 仍会再跑一次。
      - name: contract drift (agent <-> openapi)
        run: uv run pytest tests/contracts -q
        working-directory: backend/agent
      - run: uv run pytest
        working-directory: backend/agent
