# =====================================================================
# 持续集成: PR 与 push 触发
# 运行全部测试、前端构建、Compose 校验与 Docker 镜像构建。
# PR 任务绝不推送镜像,也无需真实 LLM 密钥。
# 依赖缓存: Maven (~/.m2)、pip、npm。
# =====================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 供 compose 校验/构建使用的占位必需变量(仅 CI,不包含任何真实密钥)
env:
  MYSQL_PASSWORD: ci-dummy-mysql-password
  MYSQL_ROOT_PASSWORD: ci-dummy-mysql-root-password
  REDIS_PASSWORD: ci-dummy-redis-password
  JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
  AT_ADMIN_SUPERADMIN_ID: "1"
  MINIO_ACCESS_KEY: ci-dummy-minio-access
  MINIO_SECRET_KEY: ci-dummy-minio-secret
  DOMAIN: ci.example.com
  CERT_EMAIL: ci@example.com
  DEMO_USER_PASSWORD: ci-dummy-demo-password

jobs:
  business:
    name: Business tests (mvn clean test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven clean test
        working-directory: backend/business
        run: mvn clean test -B

  agent:
    name: Agent tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/agent/requirements.txt
      - name: Install dependencies
        working-directory: backend/agent
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: backend/agent
        run: python -m pytest -q
      - name: Run offline Agent eval gate
        working-directory: backend/agent
        run: python -m evals.runner --mode offline
      - name: Validate deployment contracts
        run: python -m pytest deploy/tests/test_deploy_contracts.py

  frontend:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: frontend/${{ matrix.app }}
        run: npm ci
      - name: npm run build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  compose-config:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f compose.yml -f compose.prod.yml --profile tools config --quiet

  images:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build all images (no push)
        run: docker compose -f compose.yml -f compose.prod.yml --profile tools build
