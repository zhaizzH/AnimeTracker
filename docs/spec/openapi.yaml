        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "entityType"
              - "ids"
              properties:
                entityType:
                  type: "string"
                  enum: ["SUBJECT", "RELATION_SUBJECT", "PERSON", "CHARACTER", "ACTOR"]
                ids:
                  type: "array"
                  description: "待解析的本地主键；元素非空且为正数（@Positive），最多 50 个"
                  minItems: 1
                  maxItems: 50
                  items:
                    type: "integer"
