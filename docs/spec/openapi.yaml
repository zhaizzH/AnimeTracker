openapi: "3.0.1"
info:
  title: "API Documentation"
  version: "1.0"
paths:
  /api/client/tags:
    get:
      summary: "获取标签列表"
      description: "获取标签列表"
      responses:
        "200":
          description: "统一成功响应，其数据为：按使用次数降序排列的标签"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "array"
                    description: "统一响应承载的业务数据"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "integer"
                          description: "标签ID"
                          format: "int64"
                        name:
                          type: "string"
                          description: "标签名"
                        count:
                          type: "integer"
                          description: "该标签在此条目上的使用次数"
                      description: "标签信息 VO"
                description: "统一成功响应，其数据为：按使用次数降序排列的标签"
  /api/client/tags/{tag}/subjects:
    get:
      summary: "获取标签下的番剧列表"
      description: "获取标签下的番剧列表"
      parameters:
      - name: "tag"
        in: "path"
        description: "标签名称"
        required: true
        schema:
          type: "string"
      - name: "page"
        in: "query"
        description: "分页页码，从 1 开始"
        required: true
        schema:
          type: "integer"
          nullable: false
          default: "1"
      - name: "size"
        in: "query"
        description: "每页记录数"
        required: true
        schema:
          type: "integer"
          nullable: false
          default: "20"
      responses:
        "200":
          description: "统一成功响应，其数据为：匹配标签的条目分页"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      content:
                        type: "array"
                        description: "当前页记录列表"
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "integer"
                              description: "条目ID"
                              format: "int64"
                            name:
                              type: "string"
                              description: "日文/英文名"
                            nameCn:
                              type: "string"
                              description: "中文名"
                            image:
                              type: "string"
                              description: "封面图URL"
                            score:
                              type: "number"
                              description: "Bangumi 评分（0.0~10.0）"
                            rank:
                              type: "integer"
                              description: "Bangumi 排名"
                            eps:
                              type: "integer"
                              description: "总集数"
                            airDate:
                              type: "string"
                              description: "播出日期"
                            type:
                              type: "integer"
                              description: "条目类型（2=动画）"
                            airWeekday:
                              type: "integer"
                              description: "播出星期（0=周日, 1=周一 ... 6=周六）"
                            collectionTotal:
                              type: "integer"
                              description: "收藏数"
                          description: "条目列表视图（摘要信息）"
                      total:
                        type: "integer"
                        description: "符合条件的记录总数"
                        format: "int64"
                      page:
                        type: "integer"
                        description: "分页页码"
                      size:
                        type: "integer"
                        description: "单页返回数量"
                    description: "统一响应承载的业务数据"
                description: "统一成功响应，其数据为：匹配标签的条目分页"
  /api/client/auth/register:
    post:
      summary: "注册账户并发送邮箱验证码"
      description: "注册账户并发送邮箱验证码"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "email"
              - "password"
              - "username"
              type: "object"
              properties:
                username:
                  maxLength: 32
                  minLength: 1
                  type: "string"
                  description: "用户名（唯一）"
                password:
                  maxLength: 128
                  minLength: 6
                  type: "string"
                  description: "密码"
                email:
                  maxLength: 128
                  type: "string"
                  description: "邮箱"
                  format: "email"
              description: "注册用户名、邮箱与密码"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/auth/verify-email:
    post:
      summary: "验证邮箱并写入刷新 Cookie"
      description: "验证邮箱并写入刷新 Cookie"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "code"
              - "email"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
                code:
                  maxLength: 6
                  minLength: 6
                  type: "string"
                  description: "验证码（6位）"
              description: "邮箱地址及验证码"
      responses:
        "200":
          description: "包含访问令牌和用户信息的登录响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      token:
                        type: "string"
                        description: "认证或会话令牌"
                      user:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            description: "用户ID"
                            format: "int64"
                          username:
                            type: "string"
                            description: "用户名（唯一）"
                          email:
                            type: "string"
                            description: "邮箱"
                          nickname:
                            type: "string"
                            description: "昵称"
                          avatar:
                            type: "string"
                            description: "头像URL"
                          role:
                            type: "string"
                            description: "角色: USER=普通用户, ADMIN=管理员"
                          enabled:
                            type: "boolean"
                            description: "账号是否启用"
                          createdAt:
                            type: "string"
                            description: "创建时间"
                        description: "认证成功后的用户信息"
                    description: "统一响应承载的业务数据"
                description: "包含访问令牌和用户信息的登录响应"
  /api/client/auth/resend-code:
    post:
      summary: "重新发送邮箱验证码"
      description: "重新发送邮箱验证码"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "email"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
              description: "待重新发送验证码的邮箱"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/auth/login:
    post:
      summary: "提供登录路由的固定响应"
      description: "提供登录路由的固定响应"
      responses:
        "200":
          description: "用于断言授权通过的响应标记"
          content:
            application/json:
              schema:
                type: "string"
                description: "用于断言授权通过的响应标记"
  /api/client/auth/forgot-password:
    post:
      summary: "申请密码重置验证码"
      description: "申请密码重置验证码"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "email"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
              description: "申请重置密码的邮箱"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/auth/reset-password:
    post:
      summary: "重置密码并清除刷新 Cookie"
      description: "重置密码并清除刷新 Cookie"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "code"
              - "email"
              - "newPassword"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
                code:
                  maxLength: 6
                  minLength: 6
                  type: "string"
                  description: "验证码（6位）"
                newPassword:
                  maxLength: 128
                  minLength: 6
                  type: "string"
                  description: "新密码"
              description: "邮箱、验证码及新密码"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/auth/refresh:
    post:
      summary: "轮换登录会话，认证失败时清除刷新 Cookie"
      description: "轮换登录会话，认证失败时清除刷新 Cookie"
      responses:
        "200":
          description: "包含新访问令牌和用户信息的登录响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      token:
                        type: "string"
                        description: "认证或会话令牌"
                      user:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            description: "用户ID"
                            format: "int64"
                          username:
                            type: "string"
                            description: "用户名（唯一）"
                          email:
                            type: "string"
                            description: "邮箱"
                          nickname:
                            type: "string"
                            description: "昵称"
                          avatar:
                            type: "string"
                            description: "头像URL"
                          role:
                            type: "string"
                            description: "角色: USER=普通用户, ADMIN=管理员"
                          enabled:
                            type: "boolean"
                            description: "账号是否启用"
                          createdAt:
                            type: "string"
                            description: "创建时间"
                        description: "认证成功后的用户信息"
                    description: "统一响应承载的业务数据"
                description: "包含新访问令牌和用户信息的登录响应"
  /api/client/auth/logout:
    post:
      summary: "撤销登录凭据并清除刷新 Cookie"
      description: "撤销登录凭据并清除刷新 Cookie"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/me:
    get:
      summary: "获取当前登录用户信息"
      description: "获取当前登录用户信息"
      responses:
        "200":
          description: "统一成功响应，其数据为：当前登录用户信息"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      id:
                        type: "integer"
                        description: "用户ID"
                        format: "int64"
                      username:
                        type: "string"
                        description: "用户名（唯一）"
                      email:
                        type: "string"
                        description: "邮箱"
                      nickname:
                        type: "string"
                        description: "昵称"
                      avatar:
                        type: "string"
                        description: "头像URL"
                      role:
                        type: "string"
                        description: "角色: USER=普通用户, ADMIN=管理员"
                      enabled:
                        type: "boolean"
                        description: "账号是否启用"
                      createdAt:
                        type: "string"
                        description: "创建时间"
                    description: "统一响应承载的业务数据"
                description: "统一成功响应，其数据为：当前登录用户信息"
  /api/client/me/update:
    post:
      summary: "修改当前登录用户信息"
      description: "修改当前登录用户信息"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                nickname:
                  maxLength: 64
                  type: "string"
                  description: "昵称"
                avatar:
                  maxLength: 512
                  type: "string"
                  description: "头像URL"
              description: "待更新的昵称和头像"
      responses:
        "200":
          description: "统一成功响应，其数据为：修改当前登录用户信息"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      id:
                        type: "integer"
                        description: "用户ID"
                        format: "int64"
                      username:
                        type: "string"
                        description: "用户名（唯一）"
                      email:
                        type: "string"
                        description: "邮箱"
                      nickname:
                        type: "string"
                        description: "昵称"
                      avatar:
                        type: "string"
                        description: "头像URL"
                      role:
                        type: "string"
                        description: "角色: USER=普通用户, ADMIN=管理员"
                      enabled:
                        type: "boolean"
                        description: "账号是否启用"
                      createdAt:
                        type: "string"
                        description: "创建时间"
                    description: "统一响应承载的业务数据"
                description: "统一成功响应，其数据为：修改当前登录用户信息"
  /api/client/me/update-password:
    post:
      summary: "修改当前登录用户密码"
      description: "修改当前登录用户密码"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "newPassword"
              - "oldPassword"
              type: "object"
              properties:
                oldPassword:
                  type: "string"
                  description: "旧密码"
                newPassword:
                  maxLength: 128
                  minLength: 6
                  type: "string"
                  description: "新密码"
              description: "旧密码和新密码"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/me/send-email-code:
    post:
      summary: "发送邮箱修改验证码（修改绑定邮箱前调用，校验新邮箱未被占用）"
      description: "发送邮箱修改验证码（修改绑定邮箱前调用，校验新邮箱未被占用）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "newEmail"
              type: "object"
              properties:
                newEmail:
                  maxLength: 128
                  type: "string"
                  description: "新邮箱"
                  format: "email"
              description: "待绑定的新邮箱及本次操作所需校验信息"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/me/verify-email-code:
    post:
      summary: "校验邮箱修改验证码（通过后更新绑定邮箱并通知旧邮箱）"
      description: "校验邮箱修改验证码（通过后更新绑定邮箱并通知旧邮箱）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "code"
              - "newEmail"
              type: "object"
              properties:
                newEmail:
                  maxLength: 128
                  type: "string"
                  description: "新邮箱"
                  format: "email"
                code:
                  maxLength: 6
                  minLength: 6
                  type: "string"
                  description: "验证码（6位）"
              description: "待绑定的新邮箱及本次操作所需校验信息"
      responses:
        "200":
          description: "无数据的统一成功响应"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "string"
                    description: "统一响应承载的业务数据"
                description: "无数据的统一成功响应"
  /api/client/subjects:
    get:
      summary: "获取番剧列表"
      description: "获取番剧列表"
      parameters:
      - name: "page"
        in: "query"
        description: "页码"
        required: false
        schema:
          minimum: 1
          type: "integer"
          nullable: false
          default: 1
      - name: "size"
        in: "query"
        description: "每页条数"
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: "integer"
          nullable: false
          default: 20
      - name: "sort"
        in: "query"
        description: "排序字段（score/rank/collection_total/...）"
        required: false
        schema:
          type: "string"
          nullable: false
          default: "score"
      - name: "order"
        in: "query"
        description: "排序方向（asc/desc）"
        required: false
        schema:
          type: "string"
          nullable: false
          default: "desc"
      responses:
        "200":
          description: "统一成功响应，其数据为：符合条件的条目分页"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      content:
                        type: "array"
                        description: "当前页记录列表"
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "integer"
                              description: "条目ID"
                              format: "int64"
                            name:
                              type: "string"
                              description: "日文/英文名"
                            nameCn:
                              type: "string"
                              description: "中文名"
                            image:
                              type: "string"
                              description: "封面图URL"
                            score:
                              type: "number"
                              description: "Bangumi 评分（0.0~10.0）"
                            rank:
                              type: "integer"
                              description: "Bangumi 排名"
                            eps:
                              type: "integer"
                              description: "总集数"
                            airDate:
                              type: "string"
                              description: "播出日期"
                            type:
                              type: "integer"
                              description: "条目类型（2=动画）"
                            airWeekday:
                              type: "integer"
                              description: "播出星期（0=周日, 1=周一 ... 6=周六）"
                            collectionTotal:
                              type: "integer"
                              description: "收藏数"
                          description: "条目列表视图（摘要信息）"
                      total:
                        type: "integer"
                        description: "符合条件的记录总数"
                        format: "int64"
                      page:
