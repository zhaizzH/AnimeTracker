  /api/client/agent/health:
    get:
      summary: "健康检查"
      description: "分项探测 LLM 配置 / Redis / Business / RAG(Vector Set)，恒返回 HTTP 200，降级在体表达。Authorization 必填来自 Spring 代理层（ClientAgentController + SecurityConfig 的 /api/client/** authenticated）；直连 Agent :8090 的 Python 侧为匿名。"
