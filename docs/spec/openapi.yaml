  /actuator/health/liveness:
    get:
      security: []
      operationId: "actuatorLiveness"
      summary: "存活探针（运维接口，非业务 API）"
      description: |
        运维探针，**不是**对外业务 API。供 Agent 服务启动期健康检查使用
        （`backend/agent/app/api/health.py` 的 `BUSINESS_LIVENESS_PATH`），
        对应 `backend/business/app/src/main/resources/application.yml` 中
        `management.endpoint.health.probes.enabled: true` 暴露的 liveness 分组。

        语义：进程存活即 200，不校验数据库/Redis/Agent 等下游依赖
        （`management.health.livenessstate.enabled: true`）。就绪性请用
        `/actuator/health/readiness`，其强制 db 与 redis 两组。
      tags:
      - "运维探针"
      responses:
        "200":
          description: "进程存活"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    description: "固定为 UP"
                    example: "UP"
        "503":
          description: "进程不存活（Spring Boot liveness 分组为 DOWN）"

components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: |
        访问令牌经 `Authorization: Bearer <token>` 传递。
        客户端 access token 由前端内存持有；refresh token 走 HttpOnly Cookie（`at_refresh`）。
  schemas:
    AgentRunState:
      type: "object"
      required:
      - "run_id"
      - "status"
      properties:
        run_id:
          type: "string"
          description: "run 标识。"
        status:
          type: "string"
          enum: ["running", "done", "failed", "cancelled"]
          description: "run 生命周期状态。"
    AgentRunStop:
      type: "object"
      required:
      - "run_id"
      - "status"
      properties:
        run_id:
          type: "string"
          description: "run 标识。"
        status:
          type: "string"
          enum: ["cancelled"]
          description: "停止接口返回的终态。"
    AgentRunConflict:
      type: "object"
      required:
      - "code"
      - "message"
      - "data"
      properties:
        code:
          type: "integer"
          enum: [409]
        message:
          type: "string"
        data:
          type: "object"
          required:
          - "active_run_id"
          - "status"
          - "capabilities"
          properties:
            active_run_id:
              type: "string"
              description: "当前仍在运行的 run 标识。"
            status:
              type: "string"
              enum: ["running"]
            capabilities:
              type: "array"
              items:
                type: "string"
                enum: ["interrupt"]
              description: "客户端可对 active run 执行的能力。"
    ChatRequest:
      type: "object"
      description: "Agent 流式对话请求体。与 `backend/agent/app/api/schemas/chat.py` 的 `ChatRequest` 一致。"
      required:
      - "session_id"
      - "content"
      properties:
        session_id:
          type: "string"
          description: "会话 ID。"
        content:
          type: "string"
          minLength: 1
          maxLength: 4096
          description: "用户输入文本，1..4096 字符。"
    SSEFrame:
      type: "object"
      description: |
        SSE 单帧载荷（`text/event-stream` 的 `data:` 行 JSON）。
        分帧方式为每帧一行 `data: <JSON>` 后跟空行（`\n\n`），事件类型写在 JSON 体内。
        **结束帧为 `is_end=true`，`type` 枚举不含 `end`。**
        序列化使用 `exclude_none=True`，空值字段不出现在 wire 上。
        实现见 `backend/agent/app/api/schemas/sse.py`。
      required:
      - "content"
      - "type"
      - "is_end"
      - "timestamp"
      properties:
        type:
          type: "string"
          enum: ["answer", "thinking", "function_call", "status", "ui_action"]
          description: |-
            事件类型；无 `end` 取值。
            `ui_action` 是前端执行路由跳转的指令，载荷在 `meta`：
            `action`（白名单动作名）、`params`（动作参数）、`path`（服务端构造好的站内路径，
            前端直接 `navigate`）、`label`（浮层提示文案）、`replayed`（仅重放段出现；
            前端见到即忽略，不重复导航）。
        content:
          type: "object"
          description: "事件载荷；各子字段均可选，空值不序列化。"
          properties:
            text:
              type: "string"
              description: "增量文本。"
            node:
              type: "string"
              description: "当前图节点。"
            parent_node:
              type: "string"
              description: "父图节点。"
            state:
              type: "string"
              description: "工具/节点状态：`start` | `end`（工具）；`status` 事件上可为 `error`。"
            message:
              type: "string"
              description: "状态文案。"
            result:
              type: "string"
              description: "工具结果；失败以 `state=end` + `result=error` 表达。"
            name:
              type: "string"
              description: "工具名。"
            arguments:
              type: "string"
              description: "工具入参（JSON 字符串）。"
        meta:
          type: "object"
          nullable: true
          additionalProperties: true
          description: |-
            附加元数据；空时不出现在 wire 上（`meta={}` 会被剔除）。
            每帧由服务端补 `run_id`；`ui_action` 帧另含 `action` / `params` / `path` / `label`，
            重放段的 `ui_action` 帧额外带 `replayed=true`。
        is_end:
          type: "boolean"
          description: "是否为流结束帧。"
        timestamp:
          type: "integer"
          format: "int64"
          description: "毫秒时间戳。"
    LexicalSearchResult:
      type: object
      description: "绑定 MySQL active release 的词法召回结果。"
      required: [indexVersion, candidates]
      properties:
        indexVersion:
          type: string
          description: "必须与 Redis Vector Set 版本一致"
        profileVersion:
          type: string
        candidates:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/LexicalSearchCandidate"
    LexicalSearchCandidate:
      type: object
      required: [subjectId, rank, lexicalScore]
      properties:
        subjectId:
          type: integer
          format: int64
        name:
          type: string
        nameCn:
          type: string
        lexicalScore:
          type: number
        rank:
          type: integer
          minimum: 1
      description: "需要通过 Evidence API 补充权威证据的词法候选。"
    EvidenceCandidate:
      type: "object"
      description: "供 Agent 使用的已验证番剧证据候选。"
      properties:
        subjectId:
          type: "integer"
          format: "int64"
          description: "本地条目 ID"
        name:
          type: "string"
        nameCn:
          type: "string"
        type:
          type: "integer"
          description: "Bangumi 条目类型；2 为动画"
        nsfw:
          type: "boolean"
        active:
          type: "boolean"
          description: "已导入且可用于证据回查"
        sourceId:
          type: "integer"
          description: "Bangumi 条目 ID"
        sourceUrl:
          type: "string"
          format: "uri"
        score:
          type: "number"
          format: "double"
          description: "Bangumi 评分"
        rank:
          type: "integer"
          description: "Bangumi 排名"
        ratingTotal:
          type: "integer"
          description: "评分人数"
        collectionTotal:
          type: "integer"
          description: "收藏人数"
        airDate:
          type: "string"
          format: "date"
        airStatus:
          type: "string"
          enum: [UPCOMING, AIRING, FINISHED, UNKNOWN]
          description: "根据作品日期与剧集状态推导的播出状态"
        sourceFetchedAt:
          type: "string"
          format: "date-time"
        sourceTime:
          type: "string"
          format: "date-time"
          description: "旧字段名，兼容已有 Agent"
        summary:
          type: "string"
        aliases:
          type: "array"
          items:
            type: "string"
        metaTags:
          type: "array"
          items:
            type: "string"
        credits:
          type: "array"
          items:
            type: "object"
            properties:
              personName:
                type: "string"
              role:
                type: "string"
              relation:
                type: "string"
        characters:
          type: "array"
          items:
            type: "object"
            properties:
              characterName:
                type: "string"
              relation:
                type: "string"
        relations:
          type: "array"
          items:
            type: "object"
            properties:
              relatedSubjectId:
                type: "integer"
                format: "int64"
              relatedSubjectName:
                type: "string"
              relatedSubjectNameCn:
                type: "string"
              relation:
                type: "string"
