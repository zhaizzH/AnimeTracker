                        type: "integer"
                      reasoningEffort:
                        type: "string"
                      _sources:
                        type: "object"
                        description: "逐字段来源：default=继承 .env 默认；override=Redis 显式覆盖"
                        additionalProperties:
                          type: "string"
                          enum: ["default", "override"]
  /api/admin/agent/chat/stream:
    post:
      summary: "管理端 Agent 流式对话（SSE 流式透传，逐行转发 Python agent 响应）"
      description: |
        管理端 Agent 流式对话（SSE 流式透传，逐行转发 Python agent 响应）。

        **分帧**：每帧一行 `data: <SSEFrame JSON>`，后跟一个空行（两个换行符）作为帧分隔。
        **事件类型写在 JSON 体内**，本端点不使用 SSE `event:` 字段——因此客户端不得按
        `event:` 名分派，必须解析 `data:` 行里的 `type` 值。结束以帧内 `is_end=true` 表达。
      parameters:
      - name: "X-Request-ID"
        in: "header"
        description: "请求级 traceId；接受合法值（同 Business 字符集）或由服务端生成 UUID，并原样回写响应头。"
        required: false
        schema:
          type: "string"
      - name: "Authorization"
        in: "header"
        description: "Bearer 访问令牌。"
        required: true
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: |-
            SSE 流。每帧一行 `data: <SSEFrame JSON>` 后跟空行分帧；结束帧 `is_end=true`。
            响应头另含 `Cache-Control: no-cache`、`Connection: keep-alive`、`X-Accel-Buffering: no`。
          headers:
            X-Request-ID:
              description: "回写请求级 traceId。"
              schema:
                type: "string"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEFrame"
        "409":
          description: "同一会话已有 running run；统一响应信封的 data 携带冲突详情。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunConflict"

  /api/admin/agent/chat/runs/{runId}/stream:
    get:
      summary: "重连 Agent run 的 SSE 流"
      description: |
        重连同一 run，从 after 事件序号之后回放并继续推送。
        每帧一行 `data: <SSEFrame JSON>`，后跟一个空行分帧；不使用 SSE `event:` 字段。
      parameters:
      - name: "runId"
        in: "path"
        description: ""
        required: true
        schema:
          type: "string"
      - name: "after"
        in: "query"
        description: "已收到的事件数量，从该事件序号之后回放；缺省为 0。"
        required: false
        schema:
          type: "integer"
          minimum: 0
          default: 0
      - name: "Authorization"
        in: "header"
        description: "Bearer 访问令牌。"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "SSE 流；结束帧为 is_end=true。"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SSEFrame"
        "404":
          description: "run 不存在或不属于当前用户。"
