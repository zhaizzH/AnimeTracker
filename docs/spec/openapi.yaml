                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      previewId:
                        type: "string"
                        description: "预览ID"
                      state:
                        type: "string"
                        description: "{PENDING=预览已生成，等待用户确认, PREVIEW_CHANGED=确认时数据\
                          已变化，需要使用新预览, COMPLETED=进度执行完成，允许包含部分成功}"
                        enum:
                        - "PENDING"
                        - "PREVIEW_CHANGED"
                        - "COMPLETED"
                      expiresAt:
                        type: "object"
                        properties:
                          dateTime:
                            type: "string"
                            description: "The local date-time."
                          offset:
                            type: "object"
                            properties:
                              totalSeconds:
                                type: "integer"
                                description: "The total offset in seconds."
                            description: "The offset from UTC/Greenwich."
                        description: "过期时间"
                      weekStart:
                        type: "string"
                        description: "本周周一"
                      cutoffDate:
                        type: "string"
                        description: "截止日期（昨日）"
                      items:
                        type: "array"
                        description: "批处理或预览包含的条目集合"
                        items:
                          type: "object"
                          properties:
                            subjectId:
                              type: "integer"
                              description: "条目ID"
                              format: "int64"
                            subjectName:
                              type: "string"
                              description: "条目名称"
                            currentEpStatus:
                              type: "integer"
                              description: "当前进度"
                            targetEpStatus:
                              type: "integer"
                              description: "目标进度"
                            completedAfterUpdate:
                              type: "boolean"
                              description: "更新后是否达到总集数"
                            suggestMarkAsWatched:
                              type: "boolean"
                              description: "是否建议标记为看过"
                          description: "收藏进度预览/执行明细项"
