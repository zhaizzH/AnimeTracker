    post:
      summary: "更新模型配置"
      description: "更新模型配置：整体替换，只应提交被显式修改的字段；未提交字段回退继承 .env 默认（前端稀疏提交）。空对象提交为 no-op。"
      parameters:
      - name: "X-Request-ID"
