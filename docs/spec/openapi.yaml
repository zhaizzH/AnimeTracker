                          已变化，需要使用新预览, COMPLETED=进度执行完成，允许包含部分成功}"
                        enum:
                        - "PENDING"
                        - "PREVIEW_CHANGED"
                        - "COMPLETED"
                      replayed:
                        type: "boolean"
