      description: "ids 使用本地数据库主键；PERSON/ACTOR 为 person.id，CHARACTER 为 character.id，SUBJECT 为 subject.id；RELATION_SUBJECT 沿 subject_relation 双向扩展关联作品。仅返回已导入、动画类型且非 NSFW 的番剧。"
