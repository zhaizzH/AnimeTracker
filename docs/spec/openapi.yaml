                            type: "integer"
                            description: "平均耗时(毫秒)"
                            format: "int64"
                        description: "当前筛选条件下全量聚合统计"
                    description: "统一响应承载的业务数据"
                description: "统一成功响应，其数据为：匹配的日志分页及全量聚合统计"
