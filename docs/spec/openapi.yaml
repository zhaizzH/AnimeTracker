openapi: "3.0.1"
info:
  title: "API Documentation"
  version: "1.0"
  description: |
    手工维护的描述性契约。权威来源是可执行源码与测试（`backend/business` Controller、
    `backend/agent` Router、`frontend/packages/shared` 类型）。二者冲突时以源码为准。
    未经 CI 自动校验漂移。

    #### SSE 契约

    两个 stream 端点（`POST /api/admin/agent/chat/stream`、`POST /api/client/agent/stream`）
    响应 `text/event-stream`。帧格式：每帧一行 `data: <JSON>` 后跟一个空行（`\n\n`）分帧；
    事件类型写在 JSON 体内，不是 SSE `event:` 字段。本文件按 OpenAPI 3.0.1 建模，
    无法表达 `itemSchema`，故以「单帧 JSON 对象」schema + 本段说明表达。

    单帧字段：`type` ∈ `{answer, thinking, function_call, status}`；`content` 子字段
    `{text, node, parent_node, state, message, result, name, arguments}` 全部可选；
    `is_end`、`timestamp` 必在。**结束帧以 `is_end=true` 表达，`type` 枚举不含 `end`**
    （实现见 `backend/agent/app/api/sse.py`）。响应头另含 `Cache-Control: no-cache`、
    `Connection: keep-alive`、`X-Accel-Buffering: no`。

    #### 已知债务（未同步项）

    1. `end` 事件建模歧义：wire 上以 `type:"answer"` + `is_end:true` 表达，无独立
       `type=end`。本文件如实描述 wire 事实。
    2. 删除端点路径分层不一致：Python agent 用 `/sessions/{id}`，Spring 对外暴露
       `/sessions/{sessionId}/remove`。本文件记录 **Spring 对外层路径**（浏览器只访问
       `/api/**`，由 Spring 代理转发）。
    3. Spring 逐行转发上游 SSE 时的空行处理未静态确定（是否可能写出空 `data:` 行取决于
       `agentService.stream` 的分行实现）；见 `AdminAgentController.java:123`、
       `ClientAgentController.java:61`。
    4. stream 端点的错误响应（上游 4xx/5xx 在响应提交前的 JSON 错误体、提交后无法回落的
       情况）未建模。

    交叉引用：`.trellis/spec/guides/cross-layer-thinking-guide.md`（SSE 变更节）。

    #### 运维探针（非业务 API）

    `GET /actuator/health/liveness` 是 Spring Boot Actuator 暴露的存活探针，**不属于**
    业务 API 面。列入本文件仅为覆盖 Agent 侧的真实跨层依赖
    （`backend/agent/app/api/health.py` 的 `BUSINESS_LIVENESS_PATH`）。就绪性探针
    `/actuator/health/readiness` 未列入本文件。
