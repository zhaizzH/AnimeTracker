                              type: "string"
                              description: "失败原因"
                            durationMs:
                              type: "integer"
                              description: "耗时(毫秒)"
                              format: "int64"
                            createdAt:
                              type: "string"
                              description: "创建时间"
                          description: "操作日志 VO"
                      total:
                        type: "integer"
                        description: "匹配筛选条件的日志总数(分页)"
                        format: "int64"
                      page:
                        type: "integer"
                        description: "当前页码"
                      size:
                        type: "integer"
                        description: "每页条数"
                      stats:
                        type: "object"
                        properties:
