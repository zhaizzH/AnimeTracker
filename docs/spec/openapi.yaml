                                description: "The offset from UTC/Greenwich."
                            description: "过期时间"
                          weekStart:
                            type: "string"
                            description: "本周周一"
                          cutoffDate:
                            type: "string"
                            description: "截止日期（昨日）"
                          items:
                            type: "array"
                            description: "批处理或预览包含的条目集合"
                            items:
                              type: "object"
                              properties:
                                subjectId:
                                  type: "integer"
                                  description: "条目ID"
                                  format: "int64"
                                subjectName:
                                  type: "string"
                                  description: "条目名称"
                                currentEpStatus:
                                  type: "integer"
                                  description: "当前进度"
                                targetEpStatus:
                                  type: "integer"
                                  description: "目标进度"
                                completedAfterUpdate:
                                  type: "boolean"
                                  description: "更新后是否达到总集数"
                                suggestMarkAsWatched:
                                  type: "boolean"
                                  description: "是否建议标记为看过"
                              description: "收藏进度预览/执行明细项"
