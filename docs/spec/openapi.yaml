      responses:
        "200":
          description: "健康报告（HTTP 恒 200；依赖不可用时 status=degraded）"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    enum: ["ok", "degraded"]
                    description: "任一分项为 down 时 degraded，否则 ok"
                  llm_configured:
                    type: "boolean"
                    description: "LLM 配置是否可解析"
                  checks:
                    type: "object"
                    description: "分项探测结果，取值恒为有限枚举"
                    properties:
                      llm:
                        type: "string"
                        enum: ["ok", "down"]
                      redis:
                        type: "string"
                        enum: ["ok", "down"]
                      business:
                        type: "string"
                        enum: ["ok", "down"]
                      rag:
                        type: "string"
                        enum: ["ok", "down", "disabled"]
