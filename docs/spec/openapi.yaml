                  code:
                    type: "integer"
                    description: "统一响应或异常的状态码"
                  message:
                    type: "string"
                    description: "统一响应的状态说明"
                  data:
                    type: "object"
                    properties:
                      content:
                        type: "array"
                        description: "当前页日志明细"
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "integer"
                              description: "日志ID"
                              format: "int64"
                            userId:
                              type: "integer"
                              description: "用户ID（匿名失败登录为NULL）"
                              format: "int64"
                            username:
                              type: "string"
                              description: "用户名/邮箱快照"
                            action:
                              type: "string"
                              description: "动作"
                            module:
                              type: "string"
                              description: "模块"
                            method:
                              type: "string"
                              description: "HTTP 方法"
                            path:
                              type: "string"
                              description: "请求路径"
                            params:
                              type: "string"
                              description: "历史请求参数字段，当前采集器不填充"
                            ip:
                              type: "string"
                              description: "客户端 IP"
                            userAgent:
                              type: "string"
                              description: "客户端代理标识；当前采集器不填充，保留历史字段"
