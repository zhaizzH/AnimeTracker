      description: "运行番剧导入，供管理后台手动触发数据同步"
      parameters:
      - name: "Authorization"
        in: "header"
        description: "调用方 JWT（透传给 agent 做 ADMIN 校验）"
        required: false
        schema: {}
      - name: "mode"
        in: "query"
        description: "导入模式: full / season / recent / since"
        required: true
        schema:
          pattern: "full|season|recent|since"
          type: "string"
          nullable: false
      - name: "key"
        in: "query"
        description: "季度标识（season 模式必填），如 \"2026-summer\""
        required: false
        schema:
          type: "string"
          nullable: false
      - name: "since"
        in: "query"
        description: "起始日期（since 模式必填），如 \"2026-01-01\""
        required: false
        schema:
          type: "string"
          nullable: false
      - name: "workers"
        in: "query"
        description: "并发线程数，为空使用 Python 侧默认值"
        required: false
        schema:
          type: "integer"
          nullable: false
