          description: "各季度条目数"
          items:
            type: "object"
            properties:
              seasonKey:
                type: "string"
                description: "季度标识（如 2026-summer）"
              count:
                type: "integer"
                description: "该季度条目数"
                format: "int64"
            description: "季度数量"
        importStatuses:
          type: "array"
          description: "导入状态分布"
          items:
            type: "object"
            properties:
              importStatus:
                type: "integer"
                description: "导入状态: 0=待导入, 1=已导入"
              count:
                type: "integer"
                description: "该状态条目数"
                format: "int64"
            description: "导入状态分布"
        importStat:
          type: "object"
          properties:
            importTotal:
              type: "integer"
              description: "导入总次数"
              format: "int64"
            importSucceeded:
              type: "integer"
              description: "成功次数"
              format: "int64"
            importFailed:
              type: "integer"
              description: "失败次数"
              format: "int64"
          description: "导入记录统计"
        scoreCounts:
          type: "array"
          description: "评分分布"
          items:
            type: "object"
            properties:
              rate:
                type: "integer"
                description: "评分值 1~10"
              count:
                type: "integer"
                description: "该评分数量"
                format: "int64"
            description: "评分分布"
      description: ""
    热门榜条目:
      type: "object"
      properties:
        id:
          type: "integer"
          description: "条目ID"
          format: "int64"
        name:
          type: "string"
          description: "日文/英文名"
        nameCn:
          type: "string"
          description: "中文名"
        image:
          type: "string"
          description: "封面图URL"
        collectionCount:
          type: "integer"
          description: "收藏数"
          format: "int64"
      description: "热门榜条目"
    LexicalSearchResult:
      type: object
      description: "绑定 MySQL active release 的词法召回结果。"
      required: [indexVersion, candidates]
      properties:
        indexVersion:
          type: string
          description: "必须与 Redis Vector Set 版本一致"
        profileVersion:
          type: string
        candidates:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/LexicalSearchCandidate"
    LexicalSearchCandidate:
      type: object
      required: [subjectId, rank, lexicalScore]
      properties:
        subjectId:
          type: integer
          format: int64
        name:
          type: string
        nameCn:
          type: string
        lexicalScore:
          type: number
        rank:
          type: integer
          minimum: 1
      description: "需要通过 Evidence API 补充权威证据的词法候选。"
    EvidenceCandidate:
      type: "object"
      description: "供 Agent 使用的已验证番剧证据候选。"
      properties:
        subjectId:
          type: "integer"
          format: "int64"
          description: "本地条目 ID"
        name:
          type: "string"
        nameCn:
          type: "string"
        type:
          type: "integer"
          description: "Bangumi 条目类型；2 为动画"
        nsfw:
          type: "boolean"
        active:
          type: "boolean"
          description: "已导入且可用于证据回查"
        sourceId:
          type: "integer"
          description: "Bangumi 条目 ID"
        sourceUrl:
          type: "string"
          format: "uri"
        sourceFetchedAt:
          type: "string"
          format: "date-time"
        sourceTime:
          type: "string"
          format: "date-time"
          description: "旧字段名，兼容已有 Agent"
        summary:
          type: "string"
        aliases:
          type: "array"
          items:
            type: "string"
        metaTags:
          type: "array"
          items:
            type: "string"
        credits:
          type: "array"
          items:
            type: "object"
            properties:
              personName:
                type: "string"
              role:
                type: "string"
              relation:
                type: "string"
        characters:
          type: "array"
          items:
            type: "object"
            properties:
              characterName:
                type: "string"
              relation:
                type: "string"
        relations:
          type: "array"
          items:
            type: "object"
            properties:
              relatedSubjectId:
                type: "integer"
                format: "int64"
              relatedSubjectName:
                type: "string"
              relatedSubjectNameCn:
                type: "string"
              relation:
                type: "string"
