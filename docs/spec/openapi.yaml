openapi: "3.0.1"
info:
  title: "API Documentation"
  version: "1.0"
paths:
  /api/common/files/upload:
    post:
      summary: "上传图片到 MinIO 并返回访问 URL；type 限定 avatar/cover，仅接受 JPG/PNG/WebP"
      description: "上传图片到 MinIO 并返回访问 URL；type 限定 avatar/cover，仅接受 JPG/PNG/WebP"
      parameters:
      - name: "type"
        in: "query"
        description: ""
        required: true
        schema:
          type: "string"
          nullable: false
          default: "avatar"
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - "file"
              type: "object"
              properties:
                file:
                  type: "string"
                  description: ""
                  format: "binary"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/tags:
    get:
      summary: "获取标签列表"
      description: "获取标签列表"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "array"
                    description: ""
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "integer"
                          description: "标签ID"
                          format: "int64"
                        name:
                          type: "string"
                          description: "标签名"
                        count:
                          type: "integer"
                          description: "该标签在此条目上的使用次数"
                      description: "标签信息 VO"
  /api/client/tags/{tag}/subjects:
    get:
      summary: "获取标签下的番剧列表"
      description: "获取标签下的番剧列表"
      parameters:
      - name: "tag"
        in: "path"
        description: ""
        required: true
        schema:
          type: "string"
      - name: "page"
        in: "query"
        description: ""
        required: true
        schema:
          type: "integer"
          nullable: false
          default: "1"
      - name: "size"
        in: "query"
        description: ""
        required: true
        schema:
          type: "integer"
          nullable: false
          default: "20"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      content:
                        type: "array"
                        description: ""
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "integer"
                              description: "条目ID"
                              format: "int64"
                            name:
                              type: "string"
                              description: "日文/英文名"
                            nameCn:
                              type: "string"
                              description: "中文名"
                            image:
                              type: "string"
                              description: "封面图URL"
                            score:
                              type: "number"
                              description: "Bangumi 评分（0.0~10.0）"
                            rank:
                              type: "integer"
                              description: "Bangumi 排名"
                            eps:
                              type: "integer"
                              description: "总集数"
                            airDate:
                              type: "string"
                              description: "播出日期"
                            type:
                              type: "integer"
                              description: "条目类型（2=动画）"
                            airWeekday:
                              type: "integer"
                              description: "播出星期（0=周日, 1=周一 ... 6=周六）"
                            collectionTotal:
                              type: "integer"
                              description: "收藏数"
                          description: "条目列表视图（摘要信息）"
                      total:
                        type: "integer"
                        description: ""
                        format: "int64"
                      page:
                        type: "integer"
                        description: ""
                      size:
                        type: "integer"
                        description: ""
                    description: ""
  /api/client/auth/register:
    post:
      summary: "用户注册"
      description: "用户注册"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "email"
              - "password"
              - "username"
              type: "object"
              properties:
                username:
                  maxLength: 32
                  minLength: 1
                  type: "string"
                  description: "用户名（唯一）"
                password:
                  maxLength: 128
                  minLength: 6
                  type: "string"
                  description: "密码"
                email:
                  maxLength: 128
                  type: "string"
                  description: "邮箱"
                  format: "email"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/auth/verify-email:
    post:
      summary: "验证邮箱"
      description: "验证邮箱"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "code"
              - "email"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
                code:
                  maxLength: 6
                  minLength: 6
                  type: "string"
                  description: "验证码（6位）"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      token:
                        type: "string"
                        description: "Access Token"
                      refreshToken:
                        type: "string"
                        description: "Refresh Token（轮换）"
                      user:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            description: "用户ID"
                            format: "int64"
                          username:
                            type: "string"
                            description: "用户名（唯一）"
                          email:
                            type: "string"
                            description: "邮箱"
                          nickname:
                            type: "string"
                            description: "昵称"
                          avatar:
                            type: "string"
                            description: "头像URL"
                          role:
                            type: "string"
                            description: "角色: USER=普通用户, ADMIN=管理员"
                          createdAt:
                            type: "string"
                            description: "创建时间"
                        description: "用户信息"
                    description: ""
  /api/client/auth/resend-code:
    post:
      summary: "重新发送验证码（验证码邮件未收到或已过期时重发）"
      description: "重新发送验证码（验证码邮件未收到或已过期时重发）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "email"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/auth/login:
    post:
      summary: "用户登录（邮箱已验证，支持用户名或邮箱 + 密码）"
      description: "用户登录（邮箱已验证，支持用户名或邮箱 + 密码）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "password"
              - "username"
              type: "object"
              properties:
                username:
                  type: "string"
                  description: "用户名或邮箱"
                password:
                  type: "string"
                  description: "密码"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      token:
                        type: "string"
                        description: "Access Token"
                      refreshToken:
                        type: "string"
                        description: "Refresh Token（轮换）"
                      user:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            description: "用户ID"
                            format: "int64"
                          username:
                            type: "string"
                            description: "用户名（唯一）"
                          email:
                            type: "string"
                            description: "邮箱"
                          nickname:
                            type: "string"
                            description: "昵称"
                          avatar:
                            type: "string"
                            description: "头像URL"
                          role:
                            type: "string"
                            description: "角色: USER=普通用户, ADMIN=管理员"
                          createdAt:
                            type: "string"
                            description: "创建时间"
                        description: "用户信息"
                    description: ""
  /api/client/auth/forgot-password:
    post:
      summary: "忘记密码 — 发送重置验证码（邮箱不存在时静默成功，防枚举）"
      description: "忘记密码 — 发送重置验证码（邮箱不存在时静默成功，防枚举）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "email"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/auth/reset-password:
    post:
      summary: "忘记密码 — 重置密码（验证码校验通过后重置并踢出所有设备）"
      description: "忘记密码 — 重置密码（验证码校验通过后重置并踢出所有设备）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "code"
              - "email"
              - "newPassword"
              type: "object"
              properties:
                email:
                  type: "string"
                  description: "邮箱"
                  format: "email"
                code:
                  maxLength: 6
                  minLength: 6
                  type: "string"
                  description: "验证码（6位）"
                newPassword:
                  maxLength: 128
                  minLength: 6
                  type: "string"
                  description: "新密码"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/auth/refresh:
    post:
      summary: "刷新 Token"
      description: "刷新 Token"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "refreshToken"
              type: "object"
              properties:
                refreshToken:
                  type: "string"
                  description: "Refresh Token（轮换）"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      token:
                        type: "string"
                        description: "Access Token"
                      refreshToken:
                        type: "string"
                        description: "Refresh Token（轮换）"
                      user:
                        type: "object"
                        properties:
                          id:
                            type: "integer"
                            description: "用户ID"
                            format: "int64"
                          username:
                            type: "string"
                            description: "用户名（唯一）"
                          email:
                            type: "string"
                            description: "邮箱"
                          nickname:
                            type: "string"
                            description: "昵称"
                          avatar:
                            type: "string"
                            description: "头像URL"
                          role:
                            type: "string"
                            description: "角色: USER=普通用户, ADMIN=管理员"
                          createdAt:
                            type: "string"
                            description: "创建时间"
                        description: "用户信息"
                    description: ""
  /api/client/auth/logout:
    post:
      summary: "用户退出登录（当前 token 立即失效）"
      description: "用户退出登录（当前 token 立即失效）"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/me:
    get:
      summary: "获取当前登录用户信息"
      description: "获取当前登录用户信息"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      id:
                        type: "integer"
                        description: "用户ID"
                        format: "int64"
                      username:
                        type: "string"
                        description: "用户名（唯一）"
                      email:
                        type: "string"
                        description: "邮箱"
                      nickname:
                        type: "string"
                        description: "昵称"
                      avatar:
                        type: "string"
                        description: "头像URL"
                      role:
                        type: "string"
                        description: "角色: USER=普通用户, ADMIN=管理员"
                      createdAt:
                        type: "string"
                        description: "创建时间"
                    description: ""
  /api/client/me/update:
    post:
      summary: "修改当前登录用户信息"
      description: "修改当前登录用户信息"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                nickname:
                  maxLength: 64
                  type: "string"
                  description: "昵称"
                avatar:
                  maxLength: 512
                  type: "string"
                  description: "头像URL"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      id:
                        type: "integer"
                        description: "用户ID"
                        format: "int64"
                      username:
                        type: "string"
                        description: "用户名（唯一）"
                      email:
                        type: "string"
                        description: "邮箱"
                      nickname:
                        type: "string"
                        description: "昵称"
                      avatar:
                        type: "string"
                        description: "头像URL"
                      role:
                        type: "string"
                        description: "角色: USER=普通用户, ADMIN=管理员"
                      createdAt:
                        type: "string"
                        description: "创建时间"
                    description: ""
  /api/client/me/update-password:
    post:
      summary: "修改当前登录用户密码"
      description: "修改当前登录用户密码"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "newPassword"
              - "oldPassword"
              type: "object"
              properties:
                oldPassword:
                  type: "string"
                  description: "旧密码"
                newPassword:
                  maxLength: 128
                  minLength: 6
                  type: "string"
                  description: "新密码"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/me/send-email-code:
    post:
      summary: "发送邮箱修改验证码（修改绑定邮箱前调用，校验新邮箱未被占用）"
      description: "发送邮箱修改验证码（修改绑定邮箱前调用，校验新邮箱未被占用）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "newEmail"
              type: "object"
              properties:
                newEmail:
                  maxLength: 128
                  type: "string"
                  description: "新邮箱"
                  format: "email"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/me/verify-email-code:
    post:
      summary: "校验邮箱修改验证码（通过后更新绑定邮箱并通知旧邮箱）"
      description: "校验邮箱修改验证码（通过后更新绑定邮箱并通知旧邮箱）"
      requestBody:
        content:
          application/json:
            schema:
              required:
              - "code"
              - "newEmail"
              type: "object"
              properties:
                newEmail:
                  maxLength: 128
                  type: "string"
                  description: "新邮箱"
                  format: "email"
                code:
                  maxLength: 6
                  minLength: 6
                  type: "string"
                  description: "验证码（6位）"
              description: ""
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "string"
                    description: ""
  /api/client/subjects:
    get:
      summary: "获取番剧列表"
      description: "获取番剧列表"
      parameters:
      - name: "page"
        in: "query"
        description: "页码"
        required: false
        schema:
          minimum: 1
          type: "integer"
          nullable: false
          default: 1
      - name: "size"
        in: "query"
        description: "每页条数"
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: "integer"
          nullable: false
          default: 20
      - name: "sort"
        in: "query"
        description: "排序字段（score/rank/collection_total/...）"
        required: false
        schema:
          type: "string"
          nullable: false
          default: "score"
      - name: "order"
        in: "query"
        description: "排序方向（asc/desc）"
        required: false
        schema:
          type: "string"
          nullable: false
          default: "desc"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                    description: ""
                  message:
                    type: "string"
                    description: ""
                  data:
                    type: "object"
                    properties:
                      content:
                        type: "array"
                        description: ""
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "integer"
                              description: "条目ID"
                              format: "int64"
                            name:
                              type: "string"
                              description: "日文/英文名"
                            nameCn:
                              type: "string"
                              description: "中文名"
                            image:
                              type: "string"
                              description: "封面图URL"
                            score:
                              type: "number"
                              description: "Bangumi 评分（0.0~10.0）"
                            rank:
                              type: "integer"
                              description: "Bangumi 排名"
                            eps:
                              type: "integer"
                              description: "总集数"
                            airDate:
                              type: "string"
                              description: "播出日期"
                            type:
                              type: "integer"
                              description: "条目类型（2=动画）"
                            airWeekday:
                              type: "integer"
                              description: "播出星期（0=周日, 1=周一 ... 6=周六）"
                            collectionTotal:
                              type: "integer"
                              description: "收藏数"
                          description: "条目列表视图（摘要信息）"
                      total:
                        type: "integer"
                        description: ""
                        format: "int64"
                      page:
                        type: "integer"
                        description: ""
                      size:
                        type: "integer"
                        description: ""
                    description: ""
  /api/client/subjects/search:
    get:
      summary: "搜索番剧"
      description: "搜索番剧"
      parameters:
      - name: "q"
        in: "query"
        description: "搜索词（service 内 trim）"
        required: false
        schema:
          maxLength: 100
          type: "string"
          nullable: false
      - name: "tag"
        in: "query"
        description: "标签筛选"
        required: false
        schema:
          type: "array"
          nullable: false
          items:
            type: "string"
      - name: "scoreMin"
        in: "query"
        description: "最低评分"
        required: false
        schema:
          maximum: 10
          minimum: 0
          type: "string"
          nullable: false
      - name: "scoreMax"
        in: "query"
        description: "最高评分"
        required: false
        schema:
          maximum: 10
          minimum: 0
          type: "string"
          nullable: false
      - name: "year"
        in: "query"
        description: "年份"
        required: false
        schema:
          maximum: 2100
          minimum: 1970
          type: "integer"
          nullable: false
      - name: "weekday"
        in: "query"
        description: "播出星期"
        required: false
        schema:
          maximum: 6
          minimum: 0
          type: "integer"
          nullable: false
      - name: "sort"
        in: "query"
        description: "排序字段（进 SQL 走白名单）"
        required: false
        schema:
          type: "string"
          nullable: false
          default: "score"
      - name: "order"
        in: "query"
        description: "排序方向（asc/desc）"
        required: false
        schema:
          type: "string"
          nullable: false
          default: "desc"
      - name: "page"
        in: "query"
        description: "页码"
        required: false
