        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "entityType"
              - "ids"
              properties:
                entityType:
                  type: "string"
                  enum: ["SUBJECT", "RELATION_SUBJECT", "PERSON", "CHARACTER", "ACTOR"]
                ids:
                  type: "array"
                  minItems: 1
                  maxItems: 50
                  items:
                    type: "integer"
                    format: "int64"
      responses:
        "200":
          description: "去重后的证据候选列表；无匹配时为空数组"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "integer"
                  message:
                    type: "string"
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/EvidenceCandidate"
        "400":
          description: "实体类型缺失、ID 非正数或批量超过 50"
