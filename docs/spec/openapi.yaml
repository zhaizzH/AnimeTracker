                            enum: ["default", "override"]
                          temperature:
                            type: "string"
                            enum: ["default", "override"]
                          maxTokens:
                            type: "string"
                            enum: ["default", "override"]
                          reasoningEffort:
                            type: "string"
                            enum: ["default", "override"]
