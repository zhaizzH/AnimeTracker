# AnimeTracker — 用户端 (client) + 管理端 (admin)
# 前端 shared 包内固定 baseURL: '/api'，故 /api 必须同源反代到 business :8080

# ---------- 用户端 :80 ----------
server {
    listen 80;
    server_name 104.208.115.195;

    root /opt/animetracker/web/client;
    index index.html;

    access_log /var/log/nginx/at-client.access.log;
    error_log  /var/log/nginx/at-client.error.log;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE（Agent 流式对话）三段式增量推送，必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # LLM 单次回答可能远超默认 60s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- 管理端 :8081 ----------
server {
    listen 8081;
    server_name 104.208.115.195;

    root /opt/animetracker/web/admin;
    index index.html;

    access_log /var/log/nginx/at-admin.access.log;
    error_log  /var/log/nginx/at-admin.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
